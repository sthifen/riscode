[package]
name = "riscode"
description = "RISCode: editor y simulador RISC-V estilo VS Code"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "riscode"
path = "src/main.rs"

[dependencies]
riscode-asm = { workspace = true }
riscode-sim = { workspace = true }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui = "0.36"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
