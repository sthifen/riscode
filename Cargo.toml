[workspace]
resolver = "3"
members = ["crates/riscode-asm", "crates/riscode-sim", "app"]
default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Steven", "Isabel Sevilla"]

[workspace.dependencies]
riscode-asm = { path = "crates/riscode-asm" }
riscode-sim = { path = "crates/riscode-sim" }

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
